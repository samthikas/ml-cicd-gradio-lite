
name: ML CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: python -m black --check train.py

      - name: Train model
        run: python train.py

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: |
            results/metrics.txt
            results/confusion_matrix.png
            model/drug_model.onnx
            model/drug_model.joblib


      - name: Install Hugging Face CLI
        if: github.event_name != 'pull_request'
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy to Hugging Face Static Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          hf auth login --token "$HF_TOKEN"
          hf upload "$HF_SPACE_ID" app/ . --repo-type space --commit-message "Deploy web application"
          hf upload "$HF_SPACE_ID" model/ model --repo-type space --commit-message "Upload trained model"
          hf upload "$HF_SPACE_ID" results/ results --repo-type space --commit-message "Upload evaluation results"
